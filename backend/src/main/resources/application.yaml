spring:
  application:
    name: foody-order-tracker

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foody_tracker}
    username: ${POSTGRES_USER:foody}
    password: ${POSTGRES_PASSWORD:foody@123}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}

  servlet:
    session:
      cookie:
        name: FOODY_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
